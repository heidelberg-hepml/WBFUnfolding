[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "WBFUnfolding"
version = "1.0.0"
description = "Generative unfolding of Higgs production in weak boson fusion with H -> WW -> e nu mu nu"
authors = [
    { name = "Javier Mariño Villadamigo" },
    { name = "Lisa Marie Lehmann" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy<2.0",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "pyyaml",
    "torch>=2.2",
    "torchdiffeq",
    "torchsde",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "mlflow>=2.22",
]

[project.urls]
Repository = "https://github.com/heidelberg-hepml/WBFUnfolding"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
